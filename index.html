<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scopa: La Sfida</title>
    <style>
        :root {
            --bg-deep-blue: #0b1d3a;
            --bg-pattern-blue: #132d56;
            --gold-primary: #f3bc3c;
            --gold-light: #ffea8a;
            --gold-dark: #b8860b;
            --wood-dark: #5c3a21;
            --wood-light: #8b5a2b;
            --accent-red: #d93838;
            --accent-green: #38a169;
            --text-main: #ffffff;
            --text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep-blue);
            background-image: 
                radial-gradient(var(--bg-pattern-blue) 15%, transparent 16%),
                radial-gradient(var(--bg-pattern-blue) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 900px;
            position: relative;
            overflow: hidden;
            background: rgba(11, 29, 58, 0.85);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            padding: 15px;
            z-index: 1;
            background: var(--bg-deep-blue);
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
            z-index: 10;
        }

        /* UI Elements & Common */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 20px;
            border: 2px solid var(--gold-dark);
            margin-bottom: 20px;
        }

        .profile-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--gold-primary);
            border: 2px solid var(--gold-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .currencies {
            display: flex;
            gap: 10px;
        }

        .currency-badge {
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--gold-dark);
            border-radius: 12px;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: bold;
            color: var(--gold-light);
        }

        .btn-gold {
            background: linear-gradient(to bottom, var(--gold-light), var(--gold-primary), var(--gold-dark));
            color: #3a2200;
            font-weight: bold;
            border: 2px solid #ffffff;
            border-radius: 25px;
            padding: 12px 24px;
            text-shadow: 0 1px 0 rgba(255,255,255,0.6);
            box-shadow: 0 6px 0 #8b6508, 0 10px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            text-align: center;
            transition: all 0.1s ease;
            text-transform: uppercase;
        }

        .btn-gold:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8b6508, 0 5px 5px rgba(0,0,0,0.4);
        }

        /* Hauptmenü (Dashboard) */
        #menu-screen {
            justify-content: space-between;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle, #1a3a6b 0%, var(--bg-deep-blue) 100%);
        }

        .menu-logo-area {
            margin-top: 20px;
        }

        .game-title {
            font-size: 38px;
            font-weight: 900;
            color: var(--gold-light);
            text-shadow: 0 4px 0 var(--gold-dark), 0 8px 15px rgba(0,0,0,0.7);
            letter-spacing: 2px;
            font-style: italic;
        }

        .game-subtitle {
            font-size: 14px;
            color: #a0c4ff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .wood-table-card {
            background: linear-gradient(135deg, var(--wood-light), var(--wood-dark));
            border: 6px solid #3d2413;
            border-radius: 30px;
            padding: 30px 20px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 2px 5px rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-menu {
            background: linear-gradient(to bottom, #4a7bb0, #2b527d);
            color: white;
            border: 2px solid var(--gold-primary);
            border-radius: 15px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 0 #132a45, 0 6px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-menu:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #132a45;
        }

        /* Liga-System */
        .league-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .league-title {
            font-size: 24px;
            color: var(--gold-primary);
            text-shadow: var(--text-shadow);
        }

        .league-info-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--gold-dark);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
            color: var(--gold-light);
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .ranking-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 15px;
            border-left: 5px solid #555;
        }

        .ranking-item.promotion {
            border-left-color: var(--accent-green);
            background: rgba(56, 161, 105, 0.15);
        }

        .ranking-item.current-user {
            border: 2px solid var(--gold-primary);
            background: rgba(243, 188, 60, 0.15);
        }

        .rank-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rank-pos {
            font-weight: bold;
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .rank-name {
            font-size: 15px;
            font-weight: 500;
        }

        .rank-trophies {
            font-size: 14px;
            color: var(--gold-light);
            font-weight: bold;
        }

        /* Spielfeld */
        #game-screen {
            padding: 10px;
            background: radial-gradient(circle, #184e27 0%, #0d3819 100%);
            border: 6px solid #2e1a0b;
            justify-content: space-between;
        }

        .game-top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 13px;
        }

        .opponent-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .opponent-cards {
            display: flex;
            gap: 4px;
        }

        .table-area {
            flex-grow: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 2px dashed rgba(255,255,255,0.2);
            margin: 10px 0;
            min-height: 140px;
        }

        .player-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .player-hand {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        /* Neapolitanische Karten-Stile */
        .card {
            width: 65px;
            height: 95px;
            background: #ffffff;
            border-radius: 8px;
            border: 2px solid #222;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card.back {
            background: linear-gradient(135deg, #b91c1c, #7f1d1d);
            border: 2px solid #fef08a;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(254, 240, 138, 0.1) 10px, rgba(254, 240, 138, 0.1) 20px);
        }

        .card.selected {
            transform: translateY(-15px);
            box-shadow: 0 10px 15px rgba(243, 188, 60, 0.6);
            border-color: var(--gold-primary);
        }

        .card-top {
            font-size: 12px;
            font-weight: bold;
            line-height: 1;
        }

        .card-center {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            flex-grow: 1;
        }

        .card.denari { color: #b45309; }
        .card.coppe { color: #dc2626; }
        .card.spade { color: #1e3a8a; }
        .card.bastoni { color: #166534; }

        /* Modal / Dialog overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--bg-deep-blue);
            border: 4px solid var(--gold-primary);
            border-radius: 20px;
            padding: 25px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 22px;
            color: var(--gold-light);
            margin-bottom: 15px;
        }

        .mode-select-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--gold-light);
            font-size: 14px;
            cursor: pointer;
            text-decoration: underline;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="app-container">

        <!-- 1. HAUPTMENÜ (DASHBOARD) -->
        <div id="menu-screen" class="screen active">
            <div class="top-bar">
                <div class="profile-area">
                    <div class="avatar">👑</div>
                    <span id="player-name-display" style="font-weight: bold; font-size: 14px;">Marco</span>
                </div>
                <div class="currencies">
                    <div class="currency-badge">🪙 <span id="coin-count">1,250</span></div>
                    <div class="currency-badge">💎 <span id="gem-count">45</span></div>
                </div>
            </div>

            <div class="menu-logo-area">
                <h1 class="game-title">SCOPA</h1>
                <div class="game-subtitle">La Sfida</div>
            </div>

            <div class="wood-table-card">
                <div style="font-size: 15px; color: var(--gold-light); font-weight: bold;">Bereit für das Duell?</div>
                <button class="btn-gold" id="btn-open-mode-select" style="font-size: 18px; width: 100%;">JETZT SPIELEN</button>
            </div>

            <div class="menu-buttons">
                <button class="btn-menu" onclick="switchScreen('league-screen')">🏆 Liga-System</button>
                <button class="btn-menu" onclick="alert('Store ist in dieser Demo-Version direkt verfügbar.')">🛒 Store & Extras</button>
            </div>
        </div>

        <!-- 2. LIGA-SYSTEM (RANGLISTE) -->
        <div id="league-screen" class="screen">
            <div class="league-header">
                <h2 class="league-title">🏆 Gold-Liga</h2>
            </div>

            <div class="league-info-card">
                Ende der Saison in: <b>2 Tage 14 Std</b><br>
                <span style="color: #6ee7b7;">⭐ Die ersten 3 Positionen steigen auf!</span>
            </div>

            <div class="ranking-list" id="ranking-container">
                <!-- Dynamisch gefüllt via JS -->
            </div>

            <button class="btn-menu" onclick="switchScreen('menu-screen')">Zurück zum Menü</button>
        </div>

        <!-- 3. SPIELFELD -->
        <div id="game-screen" class="screen">
            <div class="game-top-hud">
                <span id="game-mode-title">1 vs 1 KI</span>
                <span>Punkte: <b id="score-display">Du: 0 | Gegner: 0</b></span>
                <button onclick="switchScreen('menu-screen')" style="background:none; border:none; color:white; font-size:16px; cursor:pointer;">✖</button>
            </div>

            <!-- Gegner-Bereich -->
            <div class="opponent-area">
                <span id="opponent-name" style="font-size: 13px; color: #cbd5e1;">Gegner (KI)</span>
                <div class="opponent-cards" id="opponent-hand-container">
                    <!-- Karten-Rückseiten -->
                </div>
            </div>

            <!-- Tisch-Bereich -->
            <div class="table-area" id="table-container">
                <!-- Tischkarten -->
            </div>

            <!-- Spieler-Bereich -->
            <div class="player-area">
                <span style="font-size: 13px; color: var(--gold-light);">Deine Handkarten (Tippe zum Auswählen)</span>
                <div class="player-hand" id="player-hand-container">
                    <!-- Handkarten -->
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL: MODUS-AUSWAHL -->
    <div class="modal-overlay" id="mode-modal">
        <div class="modal-content">
            <div class="modal-title">Wähle den Modus</div>
            <div class="mode-select-buttons">
                <button class="btn-gold" onclick="startGame('1v1')">1 vs 1 gegen KI</button>
                <button class="btn-gold" onclick="startGame('scopone')">Scopone (2 vs 2)</button>
            </div>
            <button class="back-btn" onclick="closeModeModal()">Abbrechen</button>
        </div>
    </div>

    <!-- MODAL: SPIELENDE / SCOPA INFO -->
    <div class="modal-overlay" id="info-modal">
        <div class="modal-content">
            <div class="modal-title" id="info-modal-title">Meldung</div>
            <p id="info-modal-text" style="margin-bottom: 20px; font-size: 14px;"></p>
            <button class="btn-gold" onclick="closeInfoModal()">Weiter</button>
        </div>
    </div>

    <script>
        // Spiel-Zustand & Daten
        const suits = ['denari', 'coppe', 'spade', 'bastoni'];
        const suitSymbols = { denari: '🪙', coppe: '🏆', spade: '🗡️', bastoni: '🪵' };
        let playerCoins = 1250;
        let playerGems = 45;
        
        let gameState = {
            mode: '1v1',
            playerHand: [],
            opponentHand: [],
            tableCards: [],
            selectedCard: null,
            playerScore: 0,
            opponentScore: 0
        };

        // Ranglisten-Daten für das Liga-System
        const rankingData = [
            { rank: 1, name: "Luigi_Pro", trophies: 1420, promotion: true },
            { rank: 2, name: "Sofia_Scopa", trophies: 1380, promotion: true },
            { rank: 3, name: "Marco (Du)", trophies: 1290, promotion: true, current: true },
            { rank: 4, name: "Giovanni99", trophies: 1210, promotion: false },
            { rank: 5, name: "NonnaBeppa", trophies: 1150, promotion: false },
            { rank: 6, name: "Matteo_RM", trophies: 1080, promotion: false },
            { rank: 7, name: "CardShark", trophies: 990, promotion: false }
        ];

        // Navigation / Screen-Manager (Kein Überlappen)
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');

            if (screenId === 'league-screen') {
                renderRanking();
            }
        }

        // Modus-Modal Steuerung
        document.getElementById('btn-open-mode-select').addEventListener('click', () => {
            document.getElementById('mode-modal').style.display = 'flex';
        });

        function closeModeModal() {
            document.getElementById('mode-modal').style.display = 'none';
        }

        function closeInfoModal() {
            document.getElementById('info-modal').style.display = 'none';
        }

        function showInfoModal(title, text) {
            document.getElementById('info-modal-title').innerText = title;
            document.getElementById('info-modal-text').innerText = text;
            document.getElementById('info-modal').style.display = 'flex';
        }

        // Rangliste rendern
        function renderRanking() {
            const container = document.getElementById('ranking-container');
            container.innerHTML = '';
            rankingData.forEach(item => {
                const div = document.createElement('div');
                div.className = `ranking-item ${item.promotion ? 'promotion' : ''} ${item.current ? 'current-user' : ''}`;
                div.innerHTML = `
                    <div class="rank-info">
                        <span class="rank-pos">#${item.rank}</span>
                        <span class="rank-name">${item.name}</span>
                    </div>
                    <span class="rank-trophies">🏆 ${item.trophies}</span>
                `;
                container.appendChild(div);
            });
        }

        // Deck-Erstellung (Neapolitanische Karten 1-10)
        function createDeck() {
            let deck = [];
            suits.forEach(suit => {
                for (let value = 1; value <= 10; value++) {
                    deck.push({ suit, value, id: `${suit}-${value}` });
                }
            });
            return deck.sort(() => Math.random() - 0.5);
        }

        // Spiel starten
        function startGame(mode) {
            closeModeModal();
            gameState.mode = mode;
            document.getElementById('game-mode-title').innerText = mode === '1v1' ? '1 vs 1 gegen KI' : 'Scopone (2 vs 2)';
            
            let deck = createDeck();
            
            // Karten verteilen
            gameState.tableCards = deck.splice(0, 4);
            gameState.playerHand = deck.splice(0, 3);
            gameState.opponentHand = deck.splice(0, 3);
            gameState.selectedCard = null;
            gameState.playerScore = 0;
            gameState.opponentScore = 0;

            switchScreen('game-screen');
            renderGame();
        }

        // Spielfeld rendern
        function renderGame() {
            // Gegner Hand (Rückseiten)
            const oppContainer = document.getElementById('opponent-hand-container');
            oppContainer.innerHTML = '';
            gameState.opponentHand.forEach(() => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card back';
                oppContainer.appendChild(cardEl);
            });

            // Tischkarten
            const tableContainer = document.getElementById('table-container');
            tableContainer.innerHTML = '';
            if (gameState.tableCards.length === 0) {
                tableContainer.innerHTML = '<span style="font-size:13px; color:rgba(255,255,255,0.6);">Tisch ist leer! (SCOPA?)</span>';
            } else {
                gameState.tableCards.forEach(card => {
                    const cardEl = createCardElement(card, () => handleTableCardClick(card));
                    tableContainer.appendChild(cardEl);
                });
            }

            // Spieler Hand
            const playerContainer = document.getElementById('player-hand-container');
            playerContainer.innerHTML = '';
            gameState.playerHand.forEach(card => {
                const cardEl = createCardElement(card, () => handlePlayerCardClick(card));
                if (gameState.selectedCard && gameState.selectedCard.id === card.id) {
                    cardEl.classList.add('selected');
                }
                playerContainer.appendChild(cardEl);
            });

            document.getElementById('score-display').innerText = `Du: ${gameState.playerScore} | Gegner: ${gameState.opponentScore}`;
        }

        // Einzelne Karte als HTML-Element generieren
        function createCardElement(card, onClick) {
            const el = document.createElement('div');
            el.className = `card ${card.suit}`;
            
            let displayVal = card.value;
            if (card.value === 1) displayVal = 'A';
            if (card.value === 8) displayVal = 'F';
            if (card.value === 9) displayVal = 'C';
            if (card.value === 10) displayVal = 'R';

            el.innerHTML = `
                <div class="card-top">${displayVal}</div>
                <div class="card-center">${suitSymbols[card.suit]}</div>
                <div class="card-top" style="transform: rotate(180deg);">${displayVal}</div>
            `;
            el.addEventListener('click', onClick);
            return el;
        }

        // Handkarte auswählen
        function handlePlayerCardClick(card) {
            if (gameState.selectedCard && gameState.selectedCard.id === card.id) {
                gameState.selectedCard = null; // Abwählen
            } else {
                gameState.selectedCard = card;
            }
            renderGame();
        }

        // Tischkarte anklicken (Einsammel-Versuch)
        function handleTableCardClick(tableCard) {
            if (!gameState.selectedCard) {
                showInfoModal('Hinweis', 'Wähle zuerst eine deiner Handkarten aus!');
                return;
            }

            const pCard = gameState.selectedCard;
            
            // Scopa Logik: Entweder exakter Wert ODER Summenregel
            if (pCard.value === tableCard.value) {
                // Direkter Treffer
                gameState.tableCards = gameState.tableCards.filter(c => c.id !== tableCard.id);
                gameState.playerHand = gameState.playerHand.filter(c => c.id !== pCard.id);
                
                if (gameState.tableCards.length === 0) {
                    gameState.playerScore += 1;
                    showInfoModal('¡SCOPA!', 'Du hast alle Karten abgeräumt und einen Punkt erhalten!');
                } else {
                    showInfoModal('Eingesammelt', `Du hast ${pCard.value} gegen ${tableCard.value} genommen.`);
                }

                gameState.selectedCard = null;
                checkRoundEnd();
            } else {
                showInfoModal('Ungültiger Zug', 'Die Werte stimmen nicht überein! (Klassische Scopa-Regel: Werte müssen matchen).');
            }
        }

        // Prüfen ob Runde vorbei ist, sonst KI Zug
        function checkRoundEnd() {
            renderGame();
            if (gameState.playerHand.length === 0) {
                if (gameState.opponentHand.length > 0) {
                    // KI Zug ausführen
                    setTimeout(aiTurn, 800);
                } else {
                    showInfoModal('Rundenende', `Das Spiel ist vorbei! Endstand - Du: ${gameState.playerScore}, Gegner: ${gameState.opponentScore}`);
                    switchScreen('menu-screen');
                }
            }
        }

        // Einfache KI-Logik
        function aiTurn() {
            if (gameState.opponentHand.length === 0) return;
            
            // KI wählt zufällige Karte
            const aiCard = gameState.opponentHand[Math.floor(Math.random() * gameState.opponentHand.length)];
            gameState.opponentHand = gameState.opponentHand.filter(c => c.id !== aiCard.id);

            // Prüfen ob KI passende Tischkarte findet
            const matchIndex = gameState.tableCards.findIndex(c => c.value === aiCard.value);
            if (matchIndex !== -1) {
                gameState.tableCards.splice(matchIndex, 1);
                if (gameState.tableCards.length === 0) {
                    gameState.opponentScore += 1;
                }
            } else {
                // Karte einfach auf den Tisch legen
                gameState.tableCards.push(aiCard);
            }
            renderGame();
        }
    </script>
</body>
