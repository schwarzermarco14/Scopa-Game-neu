<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scopa & Scopone Cartoon Arena</title>
    <!-- Google Fonts für einen modernen Cartoon-Look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --table-color: #2e8b57;
            --table-border: #1e5f38;
            --primary: #ff4757;
            --primary-hover: #ff6b81;
            --secondary: #2ed573;
            --accent: #ffa502;
            --info: #1e90ff;
            --purple: #9b59b6;
            --dark: #2f3542;
            --light: #f1f2f6;
            --card-radius: 12px;
            --ui-radius: 20px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Fredoka', cursive, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--light);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            #app {
                border-radius: 30px;
                border: 6px solid #4e5d6c;
            }
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            transition: opacity 0.3s ease;
            z-index: 10;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* Cartoon Elemente & Buttons */
        h1, h2, h3 {
            text-align: center;
            text-shadow: 3px 3px 0px #000;
        }

        h1 { font-size: 2.5rem; color: var(--accent); margin-bottom: 5px; }
        h2 { font-size: 1.8rem; color: var(--secondary); }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: var(--ui-radius);
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 0 #b33939, 0 10px 10px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 8px 0;
            width: 100%;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b33939, 0 5px 5px rgba(0,0,0,0.3);
        }

        .btn-green { background-color: var(--secondary); box-shadow: 0 6px 0 #218c53; }
        .btn-green:active { box-shadow: 0 2px 0 #218c53; }

        .btn-blue { background-color: var(--info); box-shadow: 0 6px 0 #0970d7; }
        .btn-blue:active { box-shadow: 0 2px 0 #0970d7; }

        .btn-purple { background-color: var(--purple); box-shadow: 0 6px 0 #71368a; }
        .btn-purple:active { box-shadow: 0 2px 0 #71368a; }

        /* Menu / Hauptmenü */
        .logo-container {
            text-align: center;
            margin: 20px 0;
        }

        .cartoon-trophy {
            font-size: 5rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Liga & Rang UI */
        .league-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--ui-radius);
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            border: 3px solid rgba(255,255,255,0.2);
        }

        .league-info h3 { font-size: 1.3rem; text-align: left; text-shadow: none; color: var(--accent); }
        .league-info p { font-size: 0.9rem; color: #ccc; }
        
        .progress-bar-container {
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            height: 15px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .progress-bar {
            background: var(--secondary);
            height: 100%;
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Spieltisch */
        #game-screen {
            background: radial-gradient(circle, #38ada4, var(--table-color));
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .opponent-area {
            display: flex;
            justify-content: center;
            gap: 5px;
            min-height: 75px;
            align-items: center;
        }

        .center-table {
            background: rgba(0, 0, 0, 0.25);
            border: 4px dashed rgba(255, 255, 255, 0.3);
            border-radius: var(--ui-radius);
            flex-grow: 1;
            margin: 10px 0;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            position: relative;
        }

        .player-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .player-hand {
            display: flex;
            justify-content: center;
            gap: 8px;
            min-height: 95px;
        }

        /* Karten Design (Neapolitanischer Stil Cartoon) */
        .card {
            width: 55px;
            height: 85px;
            background: #fff;
            border-radius: var(--card-radius);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, top 0.2s;
            border: 2px solid #ccc;
            font-weight: bold;
            font-size: 0.8rem;
        }

        @media (min-width: 380px) {
            .card { width: 62px; height: 95px; font-size: 0.9rem; }
        }

        .card.selected {
            transform: translateY(-15px) scale(1.05);
            border-color: var(--accent);
            box-shadow: 0 8px 15px rgba(255, 165, 2, 0.5);
        }

        .card.back {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.4);
            font-size: 1.5rem;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-center {
            text-align: center;
            font-size: 1.4rem;
        }

        .card.denari { color: #d35400; }
        .card.coppe { color: #c0392b; }
        .card.spade { color: #2c3e50; }
        .card.bastoni { color: #27ae60; }

        /* Suchbildschirm / Online Bot Fallback */
        .searching-container {
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .radar-spinner {
            width: 100px;
            height: 100px;
            border: 6px solid rgba(255,255,255,0.1);
            border-top: 6px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 30px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Modal Overlays */
        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #222f3e;
            padding: 25px;
            border-radius: var(--ui-radius);
            width: 90%;
            max-width: 400px;
            border: 4px solid var(--accent);
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-content h2 { margin-bottom: 15px; }
        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1.1rem;
        }

        /* Benachrichtigungs-Toast */
        #toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: var(--accent);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
            z-index: 1000;
            pointer-events: none;
            text-transform: uppercase;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div id="app">
    <!-- Toast Benachrichtigung -->
    <div id="toast">Scopa!</div>

    <!-- 1. HAUPTMENÜ -->
    <div id="main-menu" class="screen">
        <div class="logo-container">
            <div class="cartoon-trophy">🏆</div>
            <h1>SCOPA ARENA</h1>
            <p style="color: #a4b0be; font-weight: 600;">Das neapolitanische Kartenspiel</p>
        </div>

        <div class="league-card">
            <div class="league-info">
                <p>Aktuelle Liga</p>
                <h3 id="menu-league-name">Bronze Liga</h3>
                <div class="progress-bar-container">
                    <div id="menu-progress" class="progress-bar" style="width: 20%;"></div>
                </div>
            </div>
            <div style="font-size: 2.5rem;" id="menu-league-icon">🥉</div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 5px;">
            <button class="btn btn-green" onclick="showScreen('mode-screen')">🃏 Spielen</button>
            <button class="btn btn-blue" onclick="showScreen('league-screen')">🏅 Ligen & Ränge</button>
            <button class="btn btn-purple" onclick="showRules()">📖 Regeln</button>
        </div>
    </div>

    <!-- 2. SPIELMODI AUSWAHL -->
    <div id="mode-screen" class="screen hidden">
        <div>
            <h2 style="margin-top: 15px; margin-bottom: 25px;">Wähle den Modus</h2>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <button class="btn" onclick="startMatch('ai_1v1')">🤖 1 vs 1 gegen KI</button>
                <button class="btn btn-blue" onclick="startMatch('online_1v1')">🌐 Online Suche (Bot-Fallback)</button>
                <button class="btn btn-green" onclick="startMatch('scopone_2v2')">👥 Scopone (2 vs 2 Team)</button>
            </div>
        </div>
        <button class="btn" style="background-color: #718093; box-shadow: 0 6px 0 #4a5568;" onclick="showScreen('main-menu')">⬅ Zurück</button>
    </div>

    <!-- 3. ONLINE SUCHE / BOT FALLBACK BILDSCHIRM -->
    <div id="search-screen" class="screen hidden" style="justify-content: center; align-items: center;">
        <div class="searching-container">
            <div class="radar-spinner"></div>
            <h2>Suche Mitspieler...</h2>
            <p id="search-timer-text" style="color: #a4b0be; margin-top: 10px;">Verbleibend: 30s</p>
        </div>
        <button class="btn btn-primary" style="width: 100%; margin-bottom: 20px;" onclick="cancelSearch()">Abbrechen</button>
    </div>

    <!-- 4. LIGA & RANG SYSTEM -->
    <div id="league-screen" class="screen hidden">
        <div>
            <h2 style="margin-top: 10px; margin-bottom: 15px;">Liga-Übersicht</h2>
            <div id="league-list" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 480px; padding-right: 5px;">
                <!-- Wird dynamisch gefüllt -->
            </div>
        </div>
        <button class="btn" style="background-color: #718093; box-shadow: 0 6px 0 #4a5568;" onclick="showScreen('main-menu')">⬅ Zurück</button>
    </div>

    <!-- 5. SPIELBILDSCHIRM (TABLE) -->
    <div id="game-screen" class="screen hidden">
        <!-- Oben: Gegner oder Team-Gegner -->
        <div class="table-header">
            <span id="opp-name">Gegner (KI)</span>
            <span id="opp-score">Punkte: 0</span>
        </div>
        <div class="opponent-area" id="opponent-hand-area">
            <!-- Gegner Handkarten (Rückseite) -->
        </div>

        <!-- Mitte: Der Kartentisch -->
        <div class="center-table" id="center-table-area">
            <!-- Tischkarten -->
        </div>

        <!-- Unten: Spieler Bereich -->
        <div class="player-area">
            <div style="display: flex; justify-content: space-between; width: 100%; padding: 0 5px; font-size: 0.9rem;">
                <span id="player-name">Du</span>
                <span id="player-score">Punkte: 0</span>
            </div>
            <div class="player-hand" id="player-hand-area">
                <!-- Eigene Handkarten -->
            </div>
            <button class="btn btn-green" id="action-btn" onclick="executePlayerMove()" style="padding: 10px; margin-top: 5px; font-size: 1rem;" disabled>Karte spielen</button>
        </div>
    </div>

    <!-- SPIELENDE / RUNDENENDE MODAL -->
    <div id="result-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Runden-Ergebnis</h2>
            <div id="modal-body" style="margin: 15px 0;">
                <!-- Detaillierte Wertung -->
            </div>
            <button class="btn btn-green" onclick="closeResultModal()">Weiterspielen</button>
        </div>
    </div>

</div>

<script>
    /* --- SPIEL-KONFIGURATION & DATEN --- */
    const suits = ['denari', 'coppe', 'spade', 'bastoni'];
    const suitSymbols = { denari: '🪙', coppe: '🏆', spade: '🗡️', bastoni: '🪵' };
    
    // Ränge & Ligen
    const leagues = [
        { name: 'Bronze Liga', icon: '🥉', minWins: 0 },
        { name: 'Silber Liga', icon: '🥈', minWins: 3 },
        { name: 'Gold Liga', icon: '🥇', minWins: 7 },
        { name: 'Platin Liga', icon: '💎', minWins: 12 },
        { name: 'Grandmaster Arena', icon: '👑', minWins: 20 }
    ];

    let gameState = {
        mode: 'ai_1v1', // 'ai_1v1', 'online_1v1', 'scopone_2v2'
        playerWins: 0,
        deck: [],
        playerHand: [],
        opponentHand: [],
        partnerHand: [], // Für 2vs2
        leftOpponentHand: [], // Für 2vs2
        rightOpponentHand: [], // Für 2vs2
        tableCards: [],
        playerCaptured: [],
        opponentCaptured: [],
        teamACaptured: [], // Spieler + Partner bei Scopone
        teamBCaptured: [], // Gegner 1 + Gegner 2 bei Scopone
        turn: 0, // 0: Spieler, 1: Gegner/Nächster
        selectedCardIndex: null,
        matchScore: { team1: 0, team2: 0 },
        searchTimer: null,
        searchSecondsLeft: 30
    };

    // Beim Start laden
    window.onload = () => {
        loadProgress();
        updateLeagueUI();
    };

    function loadProgress() {
        const savedWins = localStorage.getItem('scopa_player_wins');
        if (savedWins !== null) {
            gameState.playerWins = parseInt(savedWins);
        }
    }

    function saveProgress() {
        localStorage.setItem('scopa_player_wins', gameState.playerWins);
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
        if(screenId === 'league-screen') {
            renderLeagueScreen();
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }

    /* --- LIGA UI & BERECHNUNG --- */
    function getCurrentLeague() {
        let current = leagues[0];
        for (let l of leagues) {
            if (gameState.playerWins >= l.minWins) current = l;
        }
        return current;
    }

    function updateLeagueUI() {
        const cur = getCurrentLeague();
        document.getElementById('menu-league-name').innerText = cur.name;
        document.getElementById('menu-league-icon').innerText = cur.icon;
        
        // Finde nächste Liga für Prozentbalken
        let curIdx = leagues.findIndex(l => l.name === cur.name);
        let nextLeague = leagues[curIdx + 1];
        let progressPercent = 100;
        if(nextLeague) {
            let prevWins = cur.minWins;
            let needed = nextLeague.minWins - prevWins;
            let currentInTier = gameState.playerWins - prevWins;
            progressPercent = Math.min(100, Math.max(0, (currentInTier / needed) * 100));
        }
        document.getElementById('menu-progress').style.width = progressPercent + '%';
    }

    function renderLeagueScreen() {
        const list = document.getElementById('league-list');
        list.innerHTML = '';
        let curLeague = getCurrentLeague();

        leagues.forEach((l, index) => {
            let isCurrent = l.name === curLeague.name;
            let div = document.createElement('div');
            div.className = 'league-card';
            if(isCurrent) div.style.borderColor = 'var(--accent)';
            
            div.innerHTML = `
                <div style="font-size: 2.2rem; margin-right: 15px;">${l.icon}</div>
                <div class="league-info" style="flex-grow: 1;">
                    <h3>${l.name} ${isCurrent ? '(Deine Liga)' : ''}</h3>
                    <p>Ab ${l.minWins} Siege erforderlich</p>
                </div>
            `;
            list.appendChild(div);
        });
    }

    /* --- SPIELMODI & ONLINE SUCHE --- */
    function startMatch(mode) {
        gameState.mode = mode;
        if (mode === 'online_1v1') {
            // Starte Suchbildschirm mit 30 Sek Countdown
            showScreen('search-screen');
            gameState.searchSecondsLeft = 30;
            document.getElementById('search-timer-text').innerText = `Verbleibend: ${gameState.searchSecondsLeft}s`;
            
            clearInterval(gameState.searchTimer);
            gameState.searchTimer = setInterval(() => {
                gameState.searchSecondsLeft--;
                document.getElementById('search-timer-text').innerText = `Verbleibend: ${gameState.searchSecondsLeft}s`;
                if(gameState.searchSecondsLeft <= 0) {
                    clearInterval(gameState.searchTimer);
                    showToast('Kein Gegner gefunden - Bot springt ein!');
                    initGameEngine();
                }
            }, 1000);
        } else {
            initGameEngine();
        }
    }

    function cancelSearch() {
        clearInterval(gameState.searchTimer);
        showScreen('mode-screen');
    }

    /* --- KARTEN & SPIELLOGIK (SCOPA ENGINE) --- */
    function createDeck() {
        let deck = [];
        suits.forEach(suit => {
            for (let val = 1; val <= 10; val++) {
                deck.push({ suit: suit, value: val, id: `${suit}_${val}` });
            }
        });
        // Mischen (Fisher-Yates)
        for (let i = deck.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck;
    }

    function initGameEngine() {
        showScreen('game-screen');
        gameState.deck = createDeck();
        gameState.tableCards = [];
        gameState.playerCaptured = [];
        gameState.opponentCaptured = [];
        gameState.teamACaptured = [];
        gameState.teamBCaptured = [];
        gameState.matchScore = { team1: 0, team2: 0 };

        // Namen anpassen
        if (gameState.mode === 'scopone_2v2') {
            document.getElementById('opp-name').innerText = 'Team Gegner (Giuseppe & Luigi)';
            document.getElementById('player-name').innerText = 'Du & Partner (Marco)';
        } else {
            document.getElementById('opp-name').innerText = 'Luigi (KI)';
            document.getElementById('player-name').innerText = 'Du';
        }

        startNewDeal();
    }

    function startNewDeal() {
        if (gameState.deck.length === 0) {
            // Spielende / Rundenende Auswertung
            evaluateRound();
            return;
        }

        // Austragen abhängig vom Modus
        if (gameState.mode === 'scopone_2v2') {
            // Scopone: Allen 4 Spielern werden alle 40 Karten komplett ausgeteilt (10 Karten pro Hand)
            gameState.playerHand = gameState.deck.splice(0, 10);
            gameState.partnerHand = gameState.deck.splice(0, 10);
            gameState.leftOpponentHand = gameState.deck.splice(0, 10);
            gameState.opponentHand = gameState.deck.splice(0, 10); // 4. Spieler
            gameState.tableCards = []; // Keine Tischkarten zu Beginn bei Scopone!
        } else {
            // Normales Scopa (1vs1): 3 Karten für jeden, 4 Karten auf den Tisch
            gameState.playerHand = gameState.deck.splice(0, 3);
            gameState.opponentHand = gameState.deck.splice(0, 3);
            if (gameState.tableCards.length === 0) {
                gameState.tableCards = gameState.deck.splice(0, 4);
            }
        }

        gameState.selectedCardIndex = null;
        updateGameUI();
    }

    /* --- UI RENDERING FÜR DEN TISCH --- */
    function renderCardHTML(card, isBack = false, onClickStr = '') {
        if (isBack) {
            return `<div class="card back">🎴</div>`;
        }
        let valName = card.value;
        if (card.value === 1) valName = 'A';
        if (card.value === 8) valName = 'F'; // Fante
        if (card.value === 9) valName = 'C'; // Cavallo
        if (card.value === 10) valName = 'R'; // Re

        return `
            <div class="card ${card.suit} ${onClickStr ? '' : ''}" onclick="${onClickStr}">
                <div class="card-top">
                    <span>${valName}</span>
                    <span>${suitSymbols[card.suit]}</span>
                </div>
                <div class="card-center">${suitSymbols[card.suit]}</div>
                <div class="card-top" style="transform: rotate(180deg);">
                    <span>${valName}</span>
                    <span>${suitSymbols[card.suit]}</span>
                </div>
            </div>
        `;
    }

    function updateGameUI() {
        // Tischkarten rendern
        const centerArea = document.getElementById('center-table-area');
        centerArea.innerHTML = '';
        gameState.tableCards.forEach((card, idx) => {
            let cardHtml = renderCardHTML(card, false, `selectCardOnTable(${idx})`);
            centerArea.innerHTML += cardHtml;
        });

        // Spieler Handkarten
        const playerHandArea = document.getElementById('player-hand-area');
        playerHandArea.innerHTML = '';
        gameState.playerHand.forEach((card, idx) => {
            let isSelected = gameState.selectedCardIndex === idx;
            let el = document.createElement('div');
            el.innerHTML = renderCardHTML(card, false);
            let cardDiv = el.firstElementChild;
            if(isSelected) cardDiv.classList.add('selected');
            cardDiv.onclick = () => selectPlayerCard(idx);
            playerHandArea.appendChild(el);
        });

        // Gegner Handkarten (Rückseite)
        const oppArea = document.getElementById('opponent-hand-area');
        oppArea.innerHTML = '';
        let oppHandCount = gameState.opponentHand.length;
        for(let i=0; i<oppHandCount; i++) {
            oppArea.innerHTML += renderCardHTML(null, true);
        }

        // Punktestand anzeigen
        document.getElementById('player-score').innerText = `Punkte: ${gameState.matchScore.team1}`;
        document.getElementById('opp-score').innerText = `Punkte: ${gameState.matchScore.team2}`;

        // Action Button aktivieren falls Karte gewählt
        document.getElementById('action-btn').disabled = gameState.selectedCardIndex === null || gameState.turn !== 0;
    }

    /* --- SPIELER INTERAKTIONEN --- */
    function selectPlayerCard(idx) {
        if(gameState.turn !== 0) return; // Nicht am Zug
        if(gameState.selectedCardIndex === idx) {
            gameState.selectedCardIndex = null; // Abwählen
        } else {
            gameState.selectedCardIndex = idx;
        }
        updateGameUI();
    }

    let selectedTableCardIndices = []; // Falls mehrere Kombinationen möglich sind
    function selectCardOnTable(idx) {
        // Hier können Spieler gezielt Karten zum Nehmen anklicken
        let cardEl = event.currentTarget;
        cardEl.classList.toggle('selected');
        const pos = selectedTableCardIndices.indexOf(idx);
        if(pos > -1) {
            selectedTableCardIndices.splice(pos, 1);
        } else {
            selectedTableCardIndices.push(idx);
        }
    }

    function executePlayerMove() {
        if(gameState.selectedCardIndex === null) return;
        let card = gameState.playerHand[gameState.selectedCardIndex];

        // Prüfen, ob gültiger Zug vorliegt
        // Regelprüfung: Passt die gespielte Karte zu einer einzelnen Tischkarte oder einer Summe?
        let success = processMove(card, gameState.playerHand, gameState.playerCaptured, true);
        if(!success) return;

        gameState.selectedCardIndex = null;
        selectedTableCardIndices = [];
        updateGameUI();

        // Prüfen ob Runde beendet (Hände leer)
        checkRoundEndOrNextTurn();
    }

    /* --- DIE KERN-REGELN FÜR DIE KARTEN-ABHÖRE / CAPTURE --- */
    function processMove(card, handArray, captureArray, isPlayer = false) {
        // Handkarte entfernen
        let handIdx = handArray.indexOf(card);
        if(handIdx > -1) handArray.splice(handIdx, 1);

        // Prüfe ob exakter Einzelwert auf dem Tisch liegt
        let exactMatchIndex = gameState.tableCards.findIndex(c => c.value === card.value);
        
        // Wenn man gezielt anclickt, prüfen wir die Auswahl des Spielers
        let capturedCards = [];
        if(isPlayer && selectedTableCardIndices.length > 0) {
            let sum = selectedTableCardIndices.reduce((acc, i) => acc + gameState.tableCards[i].value, 0);
            if(sum === card.value) {
                // Gültige Kombination über Klicks gewählt
                // Sortiere absteigend zum sicheren Löschen
                selectedTableCardIndices.sort((a,b) => b - a);
                selectedTableCardIndices.forEach(i => {
                    capturedCards.push(gameState.tableCards.splice(i, 1)[0]);
                });
            } else {
                showToast('Summe stimmt nicht überein!');
                handArray.push(card); // Zurück auf Hand
                return false;
            }
        } else if(exactMatchIndex > -1 && (!isPlayer || selectedTableCardIndices.length === 0)) {
            // Automatisch die Einzelkarte nehmen
            capturedCards.push(gameState.tableCards.splice(exactMatchIndex, 1)[0]);
        } else {
            // Prüfen ob Summe möglich ist
            let matchIndices = findSumCombination(gameState.tableCards, card.value);
            if(matchIndices.length > 0) {
                // Nimm die Summe
                matchIndices.sort((a,b) => b - a);
                matchIndices.forEach(i => {
                    capturedCards.push(gameState.tableCards.splice(i, 1)[0]);
                });
            } else {
                // Keine Karten genommen -> Karte bleibt auf dem Tisch liegen!
                gameState.tableCards.push(card);
                if(isPlayer) showToast('Karte auf den Tisch gelegt');
                finishTurnAfterMove();
                return true;
            }
        }

        // Karten dem Gewinner hinzufügen + Scopa Prüfung!
        capturedCards.push(card);
        captureArray.push(...capturedCards);

        // SCOPA PRÜFUNG: Wenn der Tisch komplett leergeräumt wurde und das Deck nicht leer ist (oder je nach Modus)
        if(gameState.tableCards.length === 0 && gameState.deck.length > 0) {
            showToast('✨ SCOPA! (+1 Punkt)');
            // Scopa zählen
            if(isPlayer) gameState.matchScore.team1 += 1;
            else gameState.matchScore.team2 += 1;
        } else {
            if(isPlayer) showToast('Karte(n) eingezogen!');
        }

        finishTurnAfterMove();
        return true;
    }

    function findSumCombination(table, targetVal) {
        // Einfacher Subset-Sum Algorithmus für kleine Arrays
        let n = table.length;
        for(let i=0; i<(1<<n); i++) {
            let sum = 0;
            let indices = [];
            for(let j=0; j<n; j++) {
                if((i & (1 << j)) !== 0) {
                    sum += table[j].value;
                    indices.push(j);
                }
            }
            if(sum === targetVal) return indices;
        }
        return [];
    }

    function finishTurnAfterMove() {
        selectedTableCardIndices = [];
        if(gameState.mode === 'scopone_2v2') {
            // Scopone 4 Spieler Zyklus: Du -> Partner -> Gegner1 -> Gegner2
            // Für den Prototyp simulieren wir die Mitspieler intelligent
            setTimeout(runAITurnsForScopone, 600);
        } else {
            // 1 vs 1 KI Zug
            gameState.turn = 1;
            updateGameUI();
            setTimeout(runAITurn1v1, 800);
        }
    }

    /* --- KI LOGIK --- */
    function runAITurn1v1() {
        if(gameState.opponentHand.length === 0) return;
        
        // KI wählt intelligente Karte
        let cardToPlay = chooseAICard(gameState.opponentHand, gameState.tableCards);
        processMove(cardToPlay, gameState.opponentHand, gameState.opponentCaptured, false);
        
        gameState.turn = 0;
        updateGameUI();
        checkRoundEndOrNextTurn();
    }

    function chooseAICard(hand, table) {
        // 1. Suche ob KI eine Scopa verhindern oder selbst machen kann
        for(let card of hand) {
            let exact = table.find(c => c.value === card.value);
            if(exact) return card;
        }
        // 2. Suche passende Summe
        for(let card of hand) {
            let combo = findSumCombination(table, card.value);
            if(combo.length > 0) return card;
        }
        // 3. Ansonsten spiele eine beliebige Karte (am besten hohe Karten behalten, niedrige legen)
        return hand[0];
    }

    function runAITurnsForScopone() {
        // Simuliert Partner und Gegner im 2vs2
        if(gameState.partnerHand.length > 0) {
            let pCard = gameState.partnerHand[0];
            processMove(pCard, gameState.partnerHand, gameState.teamACaptured, false);
        }
        if(gameState.leftOpponentHand.length > 0) {
            let o1Card = gameState.leftOpponentHand[0];
            processMove(o1Card, gameState.leftOpponentHand, gameState.teamBCaptured, false);
        }
        if(gameState.opponentHand.length > 0) {
            let o2Card = gameState.opponentHand[0];
            processMove(o2Card, gameState.opponentHand, gameState.teamBCaptured, false);
        }
        updateGameUI();
        checkRoundEndOrNextTurn();
    }

    function checkRoundEndOrNextTurn() {
        if(gameState.playerHand.length === 0) {
            if(gameState.deck.length > 0) {
                // Nächste 3 Karten austeilen
                if(gameState.mode === 'scopone_2v2') {
                    // Scopone teilt nur einmal komplett aus, daher ist hier die Runde vorbei
                    evaluateRound();
                } else {
                    gameState.playerHand = gameState.deck.splice(0, 3);
                    gameState.opponentHand = gameState.deck.splice(0, 3);
                    updateGameUI();
                }
            } else {
                evaluateRound();
            }
        }
    }

    /* --- SCHLUSSWERTUNG DER RUNDE (SCOPA REGELN) --- */
    function evaluateRound() {
        // Letzte verbliebene Tischkarten gehen an den letzten Spieler der sie genommen hat (vereinfacht Team 1)
        if(gameState.tableCards.length > 0) {
            gameState.playerCaptured.push(...gameState.tableCards);
            gameState.tableCards = [];
        }

        let p1Cards = gameState.playerCaptured;
        let p2Cards = gameState.opponentCaptured;
        if(gameState.mode === 'scopone_2v2') {
            p1Cards = gameState.teamACaptured;
            p2Cards = gameState.teamBCaptured;
        }

        let scoreTeam1Round = 0;
        let scoreTeam2Round = 0;
        let detailsText = '';

        // 1. CARTE (Meiste Karten: > 20 bei 40 Karten)
        if(p1Cards.length > p2Cards.length) {
            scoreTeam1Round += 1;
            detailsText += `<div class="score-row"><span>Meiste Karten (${p1Cards.length}):</span> <span style="color:var(--secondary)">+1 Pkt (Du)</span></div>`;
        } else if(p2Cards.length > p1Cards.length) {
            scoreTeam2Round += 1;
            detailsText += `<div class="score-row"><span>Meiste Karten (${p2Cards.length}):</span> <span style="color:var(--primary)">+1 Pkt (Gegner)</span></div>`;
        } else {
            detailsText += `<div class="score-row"><span>Meiste Karten:</span> <span>Unentschieden</span></div>`;
        }

        // 2. DENARI (Meiste Münzen / Karo)
        let p1Denari = p1Cards.filter(c => c.suit === 'denari').length;
        let p2Denari = p2Cards.filter(c => c.suit === 'denari').length;
        if(p1Denari > p2Denari) {
            scoreTeam1Round += 1;
            detailsText += `<div class="score-row"><span>Meiste Denari (${p1Denari}):</span> <span style="color:var(--secondary)">+1 Pkt (Du)</span></div>`;
        } else if(p2Denari > p1Denari) {
            scoreTeam2Round += 1;
            detailsText += `<div class="score-row"><span>Meiste Denari (${p2Denari}):</span> <span style="color:var(--primary)">+1 Pkt (Gegner)</span></div>`;
        }

        // 3. SETTEBELLO (7 von Denari)
        let hasSettebelloP1 = p1Cards.some(c => c.suit === 'denari' && c.value === 7);
        if(hasSettebelloP1) {
            scoreTeam1Round += 1;
            detailsText += `<div class="score-row"><span>Settebello (7🪙):</span> <span style="color:var(--secondary)">+1 Pkt (Du)</span></div>`;
        } else {
            scoreTeam2Round += 1;
            detailsText += `<div class="score-row"><span>Settebello (7🪙):</span> <span style="color:var(--primary)">+1 Pkt (Gegner)</span></div>`;
        }

        // 4. PRIMIERA (Bestes Karten-Set aus den 4 Farben)
        let primieraP1 = calcPrimiera(p1Cards);
        let primieraP2 = calcPrimiera(p2Cards);
        detailsText += `<div class="score-row"><span>Primiera (Wert):</span> <span>${primieraP1} vs ${primieraP2}</span></div>`;
        if(primieraP1 > primieraP2) {
            scoreTeam1Round += 1;
            detailsText += `<div class="score-row"><span>Primiera Punkt:</span> <span style="color:var(--secondary)">+1 Pkt (Du)</span></div>`;
        } else if(primieraP2 > primieraP1) {
            scoreTeam2Round += 1;
            detailsText += `<div class="score-row"><span>Primiera Punkt:</span> <span style="color:var(--primary)">+1 Pkt (Gegner)</span></div>`;
        }

        // Gesamtsumme addieren
        gameState.matchScore.team1 += scoreTeam1Round;
        gameState.matchScore.team2 += scoreTeam2Round;

        // Modal anzeigen
        document.getElementById('modal-title').innerText = scoreTeam1Round >= scoreTeam2Round ? 'Runde Gewonnen! 🎉' : 'Runde Verloren! 😢';
        document.getElementById('modal-body').innerHTML = `
            ${detailsText}
            <hr style="border-color:rgba(255,255,255,0.2); margin: 10px 0;">
            <div style="font-weight:bold; font-size:1.2rem;">Gesamtstand: ${gameState.matchScore.team1} : ${gameState.matchScore.team2}</div>
        `;
        document.getElementById('result-modal').classList.add('active');

        // Wenn Du gewinnst, zähle für die Liga hoch
        if(scoreTeam1Round >= scoreTeam2Round) {
            gameState.playerWins++;
            saveProgress();
            updateLeagueUI();
        }
    }

    function calcPrimiera(cards) {
        // Primiera Werte gemäß offiziellem Scopa-Standard:
        // 7 = 21, 6 = 18, Asso = 16, 5 = 15, 4 = 14, 3 = 13, 2 = 12, Re/Cavallo/Fante = 10
        const primieraValues = { 7: 21, 6: 18, 1: 16, 5: 15, 4: 14, 3: 13, 2: 12, 10: 10, 9: 10, 8: 10 };
        let bestCards = {};
        cards.forEach(c => {
            let val = primieraValues[c.value] || 0;
            if(!bestCards[c.suit] || bestCards[c.suit] < val) {
                bestCards[c.suit] = val;
            }
        });
        // Man muss in jeder der 4 Farben mindestens eine Karte haben, sonst 0
        if(Object.keys(bestCards).length < 4) return 0;
        return Object.values(bestCards).reduce((a, b) => a + b, 0);
    }

    function closeResultModal() {
        document.getElementById('result-modal').classList.remove('active');
        showScreen('main-menu');
    }

    function showRules() {
        alert("SCOPA SPIELREGELN:\n\n1. Karten nehmen: Spiele eine Karte aus deiner Hand. Wenn ihr Wert der Summe einer oder mehrerer Tischkarten entspricht, nimmst du diese.\n2. Scopa: Räumst du den Tisch komplett ab, gibt das einen Extra-Punkt!\n3. Wertung am Ende:\n- Meiste Karten (>20)\n- Meiste Denari (Karo/Münzen)\n- Settebello (7 von Denari)\n- Primiera (Höchster Kartenwert pro Farbe)\n\nZiel: Erreiche die meisten Punkte und steige in der Liga auf!");
    }
</script>
